# Net-new capacidade de CI, ver o mesmo comentário em invariant_api's
# publish-image.yml -- publica a imagem que docker-compose.appliance.yml
# referencia via `image:`.
name: publish-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/invariant-security/invariant-assessment:${{ github.ref_name }}
            ghcr.io/invariant-security/invariant-assessment:latest
