# Sem Postgres, sem Playwright, sem import de documentos -- este
# serviço não toca banco (ver api.py). Só sobe os 6 containers reais de
# teste, roda a suíte inteira (unitários + integração via TestClient) e
# derruba -- bem mais enxuto que o CI do monólito.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Só PR cancela a rodada anterior; dev/main nunca.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Containers e portas próprios da rodada (tests/fixtures/README.md):
    # nada de colidir com sessões locais nem com o CI de outro repo.
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_FIXTURE_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Mesmo lock da imagem (Dockerfile); só as ferramentas de teste
      # (extra `dev`) continuam sem pin.
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - run: pip install --no-deps -e . && pip install pytest pytest-cov pytest-timeout httpx2

      - name: Pick ports for this run
        run: |
          base=$((20000 + GITHUB_RUN_ID % 20000))
          echo "INVARIANT_SSH_TARGET_PORT=$base" >> "$GITHUB_ENV"
          echo "INVARIANT_SSH_TARGET_NONROOT_PORT=$((base + 1))" >> "$GITHUB_ENV"

      - name: Build and start the 6 fixed test containers
        run: docker compose -f tests/fixtures/docker-compose.yml up -d --build --wait --wait-timeout 120

      - run: pytest tests/ -q

      - name: Logs on failure
        if: failure()
        run: docker compose -f tests/fixtures/docker-compose.yml logs --tail=80 || true

      - name: Tear down
        if: always()
        run: docker compose -f tests/fixtures/docker-compose.yml down -v || true
