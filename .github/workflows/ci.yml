# Sem Postgres, sem Playwright, sem import de documentos -- este
# serviço não toca banco (ver api.py). Só sobe os 6 containers reais de
# teste, roda a suíte inteira (unitários + integração via TestClient) e
# derruba -- bem mais enxuto que o CI do monólito.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Só PR cancela a rodada anterior; push em dev/main tem group por sha (nunca cancela).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Containers e portas próprios da rodada (tests/fixtures/README.md):
    # nada de colidir com sessões locais nem com o CI de outro repo.
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_FIXTURE_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Mesmo lock da imagem (Dockerfile); só as ferramentas de teste
      # (extra `dev`) continuam sem pin.
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - run: pip install --no-deps -e . && pip install pytest pytest-cov pytest-timeout httpx2

      - name: Pick ports for this run
        run: |
          base=$((20000 + GITHUB_RUN_ID % 20000))
          echo "INVARIANT_SSH_TARGET_PORT=$base" >> "$GITHUB_ENV"
          echo "INVARIANT_SSH_TARGET_NONROOT_PORT=$((base + 1))" >> "$GITHUB_ENV"

      - name: Build and start the 6 fixed test containers
        run: docker compose -f tests/fixtures/docker-compose.yml up -d --build --wait --wait-timeout 120

      - run: pytest tests/ -q

      - name: Logs on failure
        if: failure()
        run: docker compose -f tests/fixtures/docker-compose.yml logs --tail=80 || true

      - name: Tear down
        if: always()
        run: docker compose -f tests/fixtures/docker-compose.yml down -v || true

  # INV-81: Trivy real (mesmo binário e SHA-256 do Dockerfile) contra uma imagem
  # sem JARs, só com a base de vulnerabilidades (sem Java DB), cache somente leitura.
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      INVARIANT_TRIVY_CACHE: ${{ github.workspace }}/.trivy-cache
      INVARIANT_REQUIRE_TRIVY_IT: "1"
      INVARIANT_TRIVY_EXPECT_VERSION: "0.76.1"
      INVARIANT_TRIVY_TEST_IMAGE: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - run: pip install --no-deps -e . && pip install pytest pytest-timeout

      - name: Install Trivy (pinned SHA-256)
        run: |
          f=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -fsSL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          sudo tar -xzf "$f" -C /usr/local/bin trivy
          trivy --version

      # Chave diária + restore-keys: a base nunca fica com 7 dias ou mais.
      - name: Date for the cache key
        id: d
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.INVARIANT_TRIVY_CACHE }}/db
          key: trivy-db-v2-${{ steps.d.outputs.day }}
          restore-keys: trivy-db-v2-

      - name: Download vulnerability DB only (no Java DB)
        run: |
          trivy image --download-db-only --cache-dir "$INVARIANT_TRIVY_CACHE"
          chmod -R a-w "$INVARIANT_TRIVY_CACHE"

      - name: Pull the pinned image
        run: docker pull "$INVARIANT_TRIVY_TEST_IMAGE"

      - run: pytest tests/test_vuln.py tests/test_vuln_integration.py -q -rA
